<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: radial-gradient(1000px 700px at 50% 40%, #16204a 0%, #0b1026 65%, #070a1c 100%); }
    .clip { position: absolute; }
    .h-title { font-family: var(--font-display); font-weight: 400; font-size: 84px; color: var(--ink); }
    .h-title .n { color: var(--gold); }
    .h-sub { font-family: var(--font-body); font-weight: 400; font-size: 38px; color: #c9d2f2; margin-top: 14px; }
    .tag { font-family: var(--font-body); font-weight: 700; font-size: 26px; letter-spacing: 0.3em; color: var(--red); }
    .count { font-family: var(--font-display); font-weight: 400; font-size: 150px; color: var(--ink); letter-spacing: -0.01em; }
    .countlab { font-family: var(--font-body); font-weight: 700; font-size: 34px; letter-spacing: 0.25em; color: var(--gold); margin-top: 6px; }
    .card { position: absolute; inset: 0; background: linear-gradient(135deg, #e63946 0%, #b02330 100%); }
    .card-big { font-family: var(--font-display); font-weight: 400; font-size: 150px; color: #fff; }
    .card-mid { font-family: var(--font-body); font-weight: 700; font-size: 46px; color: #ffe3e6; margin-top: 24px; }
    .card-cta { display: inline-block; margin-top: 44px; font-family: var(--font-body); font-weight: 900; font-size: 34px; letter-spacing: 0.08em; color: #e63946; background: #fff; padding: 22px 44px; border-radius: 999px; }
    .card-small { font-family: var(--font-body); font-weight: 400; font-size: 28px; color: #ffd6da; margin-top: 26px; }
  </style>
  <div id="root" data-composition-id="s5" data-width="1920" data-height="1080">
    <div class="clip" data-start="0" data-duration="6" style="inset: 0;">
      <div id="s5-cam" style="position: absolute; inset: 0; transform-origin: 50% 55%;"></div>
    </div>
    <div class="clip" data-start="0.3" data-duration="3.2" style="left: 110px; top: 100px; width: 1200px;">
      <div id="s5-tag" class="tag">CHAPITRE 04</div>
      <div id="s5-title" class="h-title" style="margin-top: 18px;"><span class="n">4 ·</span> LES RÉSULTATS</div>
    </div>
    <div class="clip" data-start="0.9" data-duration="2.6" style="left: 0; top: 330px; width: 100%; text-align: center;">
      <div id="s5-count" class="count">0</div>
      <div class="countlab">CADEAUX LIVRÉS CETTE NUIT</div>
    </div>
    <div class="clip" data-start="3.3" data-duration="2.7" style="inset: 0;">
      <div id="s5-card" class="card" style="position: absolute; inset: 0; opacity: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;">
        <div id="s5-cardbig" class="card-big">PÈRE NOËL™</div>
        <div id="s5-cardmid" class="card-mid">Une pub comme celle-ci pour VOTRE entreprise ?</div>
        <div id="s5-cardcta" class="card-cta">MOTION DESIGN 3D ISOMÉTRIQUE — DEMANDER UN DEVIS</div>
        <div id="s5-cardsmall" class="card-small">Réalisée en HTML/GSAP avec HyperFrames · Portfolio Vibe</div>
      </div>
    </div>
  </div>
  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });
      HF.set(50, 960, 640);
      const P = HF.P;
      let s = "";
      s += HF.ground(-4, -4, 20, "#d7e3fb");
      // axis
      s += HF.cube(-3, 8.5, 18, 0.18, { top: "#94a3b8", left: "#64748b", right: "#475569" });
      const bars = [
        { x: -2, h: 1.2, c: "#4361ee", lab: "2019" },
        { x: 2, h: 2.4, c: "#2a9d8f", lab: "2021" },
        { x: 6, h: 4.0, c: "#ffd166", lab: "2023" },
        { x: 10, h: 6.2, c: "#e63946", lab: "2025" },
      ];
      bars.forEach((b, i) => {
        s += `<g id="s5-bar${i}">` + HF.cube(b.x, 4, 2.4, b.h, { top: b.c, left: shade(b.c), right: shade2(b.c) }) + "</g>";
        const lp = P(b.x + 1.2, 5.4, 0);
        s += `<text x="${lp[0]}" y="${lp[1] + 34}" font-family="Inter" font-weight="700" font-size="30" fill="#0b1026" text-anchor="middle">${b.lab}</text>`;
      });
      function shade(hex) { const n = parseInt(hex.slice(1), 16), f = 0.78; const r = Math.round(((n >> 16) & 255) * f), g = Math.round(((n >> 8) & 255) * f), b = Math.round((n & 255) * f); return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1); }
      function shade2(hex) { const n = parseInt(hex.slice(1), 16), f = 0.55; const r = Math.round(((n >> 16) & 255) * f), g = Math.round(((n >> 8) & 255) * f), b = Math.round((n & 255) * f); return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1); }

      document.getElementById("s5-cam").innerHTML = '<svg width="1920" height="1080" viewBox="0 0 1920 1080">' + s + "</svg>";

      // camera
      tl.fromTo("#s5-cam", { scale: 0.9, y: 60 }, { scale: 1.15, y: -30, duration: 3.1, ease: "power2.inOut" }, 0);
      // bars grow from base
      bars.forEach((b, i) => {
        const base = P(b.x + 1.2, 5.2, 0);
        tl.fromTo("#s5-bar" + i, { scaleY: 0 }, { scaleY: 1, transformOrigin: base[0] + "px " + base[1] + "px", duration: 0.7, ease: "back.out(1.4)" }, 0.7 + i * 0.35);
      });
      // counter
      const fmt = (n) => Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, "\u202f");
      const obj = { v: 0 };
      tl.to(obj, { v: 2000000000, duration: 2.0, ease: "power2.out", onUpdate: () => { document.getElementById("s5-count").textContent = fmt(obj.v); } }, 1.0);

      tl.fromTo("#s5-tag", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.3);
      tl.fromTo("#s5-title", { opacity: 0, y: 40, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.6, ease: "power4.out" }, 0.5);
      tl.fromTo("#s5-count", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" }, 0.9);
      tl.to(["#s5-tag", "#s5-title", "#s5-count"], { opacity: 0, y: -24, filter: "blur(8px)", duration: 0.3, ease: "power2.in" }, 3.2);
      tl.to("#s5-cam", { opacity: 0, duration: 0.3, ease: "power1.in" }, 3.25);

      // end card
      tl.fromTo("#s5-card", { opacity: 0, scale: 1.25, filter: "blur(12px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.55, ease: "power3.out" }, 3.35);
      tl.fromTo("#s5-cardbig", { opacity: 0, y: 50, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power4.out" }, 3.6);
      tl.fromTo("#s5-cardmid", { opacity: 0, y: 36 }, { opacity: 1, y: 0, duration: 0.45, ease: "power4.out" }, 3.85);
      tl.fromTo("#s5-cardcta", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.7)" }, 4.15);
      tl.fromTo("#s5-cardsmall", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 4.45);
      tl.to("#s5-card", { opacity: 0, duration: 0.3, ease: "power1.in" }, 5.65);

      window.__timelines["s5"] = tl;
    })();
  </script>
</template>
