<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: radial-gradient(1000px 650px at 70% 20%, #1b2350 0%, #0b1026 60%, #070a1c 100%); }
    .clip { position: absolute; }
    .star { position: absolute; border-radius: 50%; background: #fff; }
    .moon { position: absolute; border-radius: 50%; background: #f5f3ce; box-shadow: 0 0 80px 30px rgba(245, 243, 206, 0.35); }
    .flake { position: absolute; border-radius: 50%; background: #fff; }
    .h-title { font-family: var(--font-display); font-weight: 400; font-size: 84px; color: var(--ink); }
    .h-title .n { color: var(--gold); }
    .h-sub { font-family: var(--font-body); font-weight: 400; font-size: 38px; color: #c9d2f2; margin-top: 14px; }
    .tag { font-family: var(--font-body); font-weight: 700; font-size: 26px; letter-spacing: 0.3em; color: var(--red); }
  </style>
  <div id="root" data-composition-id="s3" data-width="1920" data-height="1080">
    <div id="s3-sky" style="position: absolute; inset: 0;"></div>
    <div class="clip" data-start="0" data-duration="6" style="inset: 0;">
      <div id="s3-cam" style="position: absolute; inset: 0; transform-origin: 55% 45%;"></div>
    </div>
    <div id="s3-snow" style="position: absolute; inset: 0; overflow: hidden;"></div>
    <div class="clip" data-start="0.3" data-duration="5.4" style="left: 110px; top: 110px; width: 1200px;">
      <div id="s3-tag" class="tag">CHAPITRE 02</div>
      <div id="s3-title" class="h-title" style="margin-top: 18px;"><span class="n">2 ·</span> LA TOURNÉE DE MINUIT</div>
      <div id="s3-sub" class="h-sub">8 milliards de toits visités avant l'aube.</div>
    </div>
  </div>
  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });
      HF.set(46, 980, 620);
      const P = HF.P;
      const rng = HF.mulberry32(4242);

      // sky: moon + stars
      const sky = document.getElementById("s3-sky");
      sky.innerHTML = '<div class="moon" style="right: 220px; top: 120px; width: 130px; height: 130px;"></div>';
      for (let i = 0; i < 60; i++) {
        const st = document.createElement("div");
        st.className = "star";
        const sz = 1 + rng() * 3;
        st.style.width = st.style.height = sz + "px";
        st.style.left = rng() * 1920 + "px";
        st.style.top = rng() * 500 + "px";
        st.style.opacity = (0.3 + rng() * 0.7).toFixed(2);
        sky.appendChild(st);
      }

      // snow
      const snow = document.getElementById("s3-snow");
      const flakes = [];
      for (let i = 0; i < 60; i++) {
        const f = document.createElement("div");
        f.className = "flake";
        const sz = 2 + rng() * 6;
        f.style.width = f.style.height = sz + "px";
        f.style.left = rng() * 1920 + "px";
        f.style.opacity = (0.25 + rng() * 0.6).toFixed(2);
        snow.appendChild(f);
        flakes.push(f);
      }
      flakes.forEach((f) => tl.fromTo(f, { y: -30 }, { y: 1140, duration: 3.5 + rng() * 3, ease: "none" }, rng() * 6));

      let s = "";
      s += HF.ground(-4, -4, 22, "#d7e3fb");
      // roads (darker diamonds)
      s += HF.ground(-4, 4.9, 22, "#aebadb");
      s += HF.ground(4.9, -4, 0.0 + 22, "#aebadb");
      // route (dashed)
      const route = [[-3, 8.5], [1, 7], [4.5, 5.6], [8, 4.2], [11, 2.2], [14.5, 0.2]];
      const routePts = route.map((w) => P(w[0], w[1], 6.5).map((n) => n.toFixed(1)).join(",")).join(" ");
      s += `<polyline points="${routePts}" fill="none" stroke="#e63946" stroke-width="5" stroke-dasharray="2 16" stroke-linecap="round" opacity="0.9"/>`;

      // houses
      const houseSpots = [[-2.5, 0.5], [0.5, 0.8], [2.8, 1.6], [6.5, 0.6], [10, 0.8], [-2.8, 6.2], [0.5, 9.5], [6.8, 8.8], [10.5, 6.5], [13, 4.6]];
      const wallCols = ["#e8b4b8", "#cdeac0", "#ffd6a5", "#a0c4ff", "#fdffb6"];
      houseSpots.forEach((h, i) => {
        const w = wallCols[i % wallCols.length];
        const dark = "#00000022";
        s += HF.cube(h[0], h[1], 1.7, 1.15, { top: "#ffffff", left: w, right: shade(w) });
        s += HF.pyramid(h[0], h[1], 1.7, 1.15, 1.0, ["#e63946", "#b02330", "#8f1b26", "#e63946"]);
        if (i % 2 === 0) {
          s += `<polygon points="${HF.pts([P(h[0] + 1.7, h[1] + 0.4, 0.3), P(h[0] + 1.7, h[1] + 1.3, 0.3), P(h[0] + 1.7, h[1] + 1.3, 0.95), P(h[0] + 1.7, h[1] + 0.4, 0.95)])}" fill="#ffd166"/>`;
        }
      });
      function shade(hex) {
        const n = parseInt(hex.slice(1), 16);
        const f = 0.72;
        const r = Math.round(((n >> 16) & 255) * f), g = Math.round(((n >> 8) & 255) * f), b = Math.round((n & 255) * f);
        return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
      }
      // trees
      for (let i = 0; i < 7; i++) {
        const tx = -3 + i * 3.2, ty = 13;
        s += HF.cube(tx, ty, 0.35, 0.7, { top: "#6b4f2a", left: "#54401f", right: "#3d2e16" }) + HF.pyramid(tx - 0.25, ty - 0.25, 0.9, 0.7, 1.8, ["#1d5c46", "#174a39", "#123a2d", "#1d5c46"]);
      }

      // sleigh at route start, height 6.5
      const st = route[0];
      const sleigh =
        HF.cube(st[0] - 0.2, st[1] - 0.2, 1.5, 0.7, { top: "#e63946", left: "#b02330", right: "#8f1b26" }) +
        HF.cube(st[0] + 0.4, st[1] + 0.4, 0.8, 0.55, { top: "#ffd166", left: "#d9a94f", right: "#b8892f" }) +
        `<polygon points="${HF.pts([P(st[0] - 0.5, st[1] - 0.5, 0), P(st[0] + 1.6, st[1] - 0.5, 0), P(st[0] + 1.6, st[1] - 0.5, 0.12), P(st[0] - 0.5, st[1] - 0.5, 0.12)])}" fill="#94a3b8"/>`;
      s += `<g id="s3-sleigh">${sleigh}</g>`;

      document.getElementById("s3-cam").innerHTML = '<svg width="1920" height="1080" viewBox="0 0 1920 1080">' + s + "</svg>";

      // camera: zoom + follow
      tl.fromTo("#s3-cam", { scale: 0.8, x: 120, y: 90 }, { scale: 1.28, x: -160, y: -90, duration: 5.7, ease: "power2.inOut" }, 0);
      // sleigh along route
      const start = P(route[0][0], route[0][1], 6.5);
      let prev = start;
      for (let i = 1; i < route.length; i++) {
        const cur = P(route[i][0], route[i][1], 6.5);
        const dx = cur[0] - start[0], dy = cur[1] - start[1];
        const t = 0.7 + (i - 1) * 0.95;
        tl.to("#s3-sleigh", { x: dx, y: dy, duration: 0.95, ease: "none" }, t);
        tl.to("#s3-sleigh", { rotation: i % 2 ? 6 : -6, duration: 0.3, ease: "power1.inOut" }, t + 0.6);
      }
      tl.fromTo("#s3-sleigh", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.6)" }, 0.5);
      tl.to("#s3-sleigh", { opacity: 0, scale: 1.6, duration: 0.3, ease: "power2.in" }, 5.6);

      tl.fromTo("#s3-tag", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.3);
      tl.fromTo("#s3-title", { opacity: 0, y: 40, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.6, ease: "power4.out" }, 0.5);
      tl.fromTo("#s3-sub", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.5, ease: "power4.out" }, 0.95);
      tl.to(["#s3-tag", "#s3-title", "#s3-sub"], { opacity: 0, y: -20, filter: "blur(8px)", duration: 0.35, ease: "power2.in" }, 5.5);

      window.__timelines["s3"] = tl;
    })();
  </script>
</template>
